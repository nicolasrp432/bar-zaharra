name: Desplegar en GitHub Pages

on:
  push:
    branches:
      - main
      # despliegue de la v1 antes del merge; se puede quitar esta línea después
      - claude/zaharra-interactive-menu-yfki1q
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Compilar (base /bar-zaharra/)
        run: npx tsc --noEmit && npx vite build --base=/bar-zaharra/

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
